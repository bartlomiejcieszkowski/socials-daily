[project]
name = "socials-daily"
version = "0.1.0"
description = "Multi-platform social media daily digest CLI"
authors = [
    { name = "Bartlomiej Cieszkowski", email = "bartlomiej.cieszkowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.72",
    "feedparser>=6.0.14",
    "httpx>=0.27.0",
    "instaloader>=4.15.3",
]

[project.optional-dependencies]
hikerapi = ["hikerapi>=1.8.2"]
xpoz = ["xpoz>=0.8.0"]
youtube = ["yt-dlp>=2024.0.0"]

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
